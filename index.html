<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sewing Supply Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <h1>🧵 Sewing Supply Tracker</h1>
      <p>Inventory, low-stock alerts, collections, shopping list, and labels.</p>
      <button id="darkModeBtn" class="secondary smallBtn">🌙 Dark Mode</button>
    </header>

    <section class="card dashboard">
      <div><strong id="totalItems">0</strong><span>Total Items</span></div>
      <div><strong id="lowStockCount">0</strong><span>Low Stock</span></div>
      <div><strong id="categoryCount">0</strong><span>Categories</span></div>
      <div><strong id="shoppingCount">0</strong><span>Shopping List</span></div>
    </section>

    <section class="card controls">
      <select id="collectionSelect"></select>
      <button id="addCollectionBtn" class="secondary">Add Collection</button>
      <button id="deleteCollectionBtn" class="secondary dangerText">Delete Collection</button>
    </section>

    <section class="card formCard">
      <h2 id="formTitle">Add Supply</h2>

      <form id="supplyForm">
        <input type="hidden" id="editId" />

        <label>Item Name <input id="name" required /></label>

        <label>
          Category
          <select id="category" required>
            <option value="">Choose category</option>
            <option>Thread</option>
            <option>Needles</option>
            <option>Fabric</option>
            <option>Bobbins</option>
            <option>Presser Feet</option>
            <option>Tools</option>
            <option>Parts</option>
            <option>Oil / Maintenance</option>
            <option>Other</option>
          </select>
        </label>

        <label>Details <input id="details" placeholder="Color, size, brand..." /></label>
        <label>Quantity <input id="quantity" type="number" min="0" required /></label>
        <label>Low Stock Warning <input id="lowStock" type="number" min="0" /></label>
        <label>Location <input id="location" placeholder="Drawer, bin, shelf..." /></label>

        <label class="full">
          Photo / Camera
          <input id="photo" type="file" accept="image/*" capture="environment" />
        </label>

        <label class="full">Notes <textarea id="notes"></textarea></label>

        <div class="formButtons full">
          <button type="submit" id="submitBtn">Add Supply</button>
          <button type="button" id="cancelEditBtn" class="secondary hidden">Cancel Edit</button>
        </div>
      </form>
    </section>

    <section class="card controls">
      <input id="search" placeholder="Search supplies..." />

      <select id="categoryFilter">
        <option value="All">All categories</option>
        <option>Thread</option>
        <option>Needles</option>
        <option>Fabric</option>
        <option>Bobbins</option>
        <option>Presser Feet</option>
        <option>Tools</option>
        <option>Parts</option>
        <option>Oil / Maintenance</option>
        <option>Other</option>
      </select>

      <select id="stockFilter">
        <option value="All">All stock</option>
        <option value="Low">Low stock only</option>
      </select>

      <select id="sortBy">
        <option value="newest">Newest first</option>
        <option value="name">Name A-Z</option>
        <option value="category">Category A-Z</option>
        <option value="quantityLow">Quantity low-high</option>
        <option value="quantityHigh">Quantity high-low</option>
      </select>

      <button id="exportCsvBtn" class="secondary">Export CSV</button>
      <button id="exportJsonBtn" class="secondary">Backup JSON</button>

      <label class="fileRestore">
        Restore JSON
        <input id="restoreJsonInput" type="file" accept="application/json" />
      </label>

      <button id="printLabelsBtn" class="secondary">Print Labels</button>
    </section>

    <section class="inventoryHeader">
      <h2>Inventory</h2>
      <p id="itemCount">0 items</p>
    </section>

    <section id="inventoryList" class="inventoryGrid"></section>

    <section class="card shoppingCard">
      <h2>Shopping List</h2>
      <div class="shoppingInput">
        <input id="manualShoppingItem" placeholder="Add item to buy..." />
        <button id="addShoppingBtn">Add</button>
      </div>
      <button id="addLowStockBtn" class="secondary">Add Low Stock Items</button>
      <div id="shoppingList"></div>
    </section>

    <button id="scrollToFormBtn" class="floatingBtn">＋</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
